<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10131f">
  <title>Cuenta regresiva</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #10131f;
      color: #f5f3ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, rgb(104 82 190 / 22%), transparent 52%),
        linear-gradient(145deg, #10131f 12%, #17152b 55%, #10131f);
    }

    main {
      width: min(100% - 2rem, 1000px);
      padding: 3rem 0px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: #b9a9ff;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #b9a9ff;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 600;
      letter-spacing: -0.045em;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 0.8rem 0 3rem;
      color: #aaa8bd;
      font-size: clamp(1rem, 2vw, 1.2rem);
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(0.6rem, 3vw, 1.5rem);
    }

    .unit {
      padding: clamp(1rem, 3vw, 1.75rem) 0.5rem;
      border: 1px solid rgb(193 177 255 / 17%);
      border-radius: 1.25rem;
      background: rgb(255 255 255 / 4%);
      box-shadow: 0 18px 60px rgb(0 0 0 / 15%);
      backdrop-filter: blur(10px);
    }

    .value {
      display: block;
      font-size: clamp(2.3rem, 9vw, 5.5rem);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      letter-spacing: -0.07em;
      line-height: 1;
    }

    .label {
      display: block;
      margin-top: 0.85rem;
      color: #aaa8bd;
      font-size: clamp(0.65rem, 1.7vw, 0.85rem);
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .note {
      margin: 2rem 0 0;
      color: #77758c;
      font-size: 0.85rem;
    }

    .music-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 1;
      display: grid;
      width: 2.75rem;
      height: 2.75rem;
      padding: 0;
      place-items: center;
      border: 1px solid rgb(193 177 255 / 45%);
      border-radius: 999px;
      background: #b9a9ff;
      color: #17152b;
      cursor: pointer;
    }

    .music-toggle:hover {
      background: #c9bdff;
    }

    .music-toggle svg {
      width: 1.25rem;
      height: 1.25rem;
      fill: currentColor;
    }

    .music-toggle[aria-pressed="true"] .play-icon,
    .music-toggle[aria-pressed="false"] .pause-icon {
      display: none;
    }

    .music-toggle:focus-visible {
      outline: 3px solid #f5f3ff;
      outline-offset: 3px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 480px) {
      main {
        padding-inline: 0;
      }

      .subtitle {
        margin-bottom: 2rem;
      }

      .unit {
        border-radius: 0.9rem;
      }
    }
  </style>
</head>

<body>
  <button class="music-toggle" id="musicToggle" type="button" aria-label="Reanudar música" aria-pressed="false">
    <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M8 5v14l11-7z"></path>
    </svg>
    <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M6 5h4v14H6zm8 0h4v14h-4z"></path>
    </svg>
  </button>
  <span class="sr-only" id="musicStatus" role="status" aria-live="polite"></span>

  <main>

    <h1>Falta poco para que Maisheila vea a los beteeses</h1>
    <p class="subtitle">24 de octubre - 20:00hs</p>

    <section class="countdown" aria-label="Tiempo restante">
      <div class="unit">
        <span class="value" id="days">00</span>
        <span class="label">Días</span>
      </div>
      <div class="unit">
        <span class="value" id="hours">00</span>
        <span class="label">Horas</span>
      </div>
      <div class="unit">
        <span class="value" id="minutes">00</span>
        <span class="label">Minutos</span>
      </div>
      <div class="unit">
        <span class="value" id="seconds">00</span>
        <span class="label">Segundos</span>
      </div>
    </section>

    <p class="note" id="note"></p>

  </main>

  <audio id="backgroundMusic" autoplay loop preload="auto" hidden>
    <source src="./dynamite.mp3" type="audio/mpeg">
  </audio>

  <script>

    window.addEventListener('load', () => {
      const audio = document.getElementById('backgroundMusic');

      audio.play().catch(error => {
        console.log('El navegador bloqueó la reproducción automática.');
      });
    });

    const target = new Date(2026, 9, 24, 20, 0, 0);
    const units = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds")
    };
    const note = document.getElementById("note");
    const backgroundMusic = document.getElementById("backgroundMusic");
    const musicToggle = document.getElementById("musicToggle");
    const musicStatus = document.getElementById("musicStatus");
    let musicPausedByUser = false;

    function updateMusicToggle() {
      const isPlaying = !backgroundMusic.paused;
      musicToggle.setAttribute("aria-pressed", String(isPlaying));
      musicToggle.setAttribute("aria-label", isPlaying ? "Pausar música" : "Reanudar música");
    }

    function removePlaybackRetryListeners() {
      window.removeEventListener("pointerdown", retryBackgroundMusic);
      window.removeEventListener("keydown", retryBackgroundMusic);
    }

    async function retryBackgroundMusic(event) {
      if (musicPausedByUser || musicToggle.contains(event.target)) {
        return;
      }

      removePlaybackRetryListeners();
      await startBackgroundMusic();
    }

    async function startBackgroundMusic() {
      try {
        await backgroundMusic.play();
        removePlaybackRetryListeners();
      } catch (error) {
        if (error instanceof DOMException && error.name === "NotAllowedError") {
          window.addEventListener("pointerdown", retryBackgroundMusic);
          window.addEventListener("keydown", retryBackgroundMusic);
          return;
        }

        console.error("No se pudo reproducir el audio de fondo.", error);
      }
    }

    musicToggle.addEventListener("click", async () => {
      if (!backgroundMusic.paused) {
        musicPausedByUser = true;
        backgroundMusic.pause();
        musicStatus.textContent = "Música pausada.";
        updateMusicToggle();
        return;
      }

      musicPausedByUser = false;
      try {
        await backgroundMusic.play();
        musicStatus.textContent = "Música reanudada.";
        updateMusicToggle();
        removePlaybackRetryListeners();
      } catch (error) {
        if (error instanceof DOMException && error.name === "NotAllowedError") {
          window.addEventListener("pointerdown", retryBackgroundMusic);
          window.addEventListener("keydown", retryBackgroundMusic);
          musicStatus.textContent = "El navegador bloqueó el audio. Revisa los permisos de sonido para este sitio e inténtalo de nuevo.";
          return;
        }

        musicStatus.textContent = "No se pudo reproducir el audio.";
        console.error("No se pudo reproducir el audio de fondo.", error);
      }
    });

    backgroundMusic.addEventListener("play", updateMusicToggle);
    backgroundMusic.addEventListener("pause", updateMusicToggle);
    updateMusicToggle();
    startBackgroundMusic();

    function updateCountdown() {
      const remaining = target.getTime() - Date.now();

      if (remaining <= 0) {
        Object.values(units).forEach((unit) => {
          unit.textContent = "00";
        });
        note.textContent = "¡Llegó el momento!";
        return;
      }

      const totalSeconds = Math.floor(remaining / 1000);
      units.days.textContent = String(Math.floor(totalSeconds / 86400)).padStart(2, "0");
      units.hours.textContent = String(Math.floor((totalSeconds % 86400) / 3600)).padStart(2, "0");
      units.minutes.textContent = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
      units.seconds.textContent = String(totalSeconds % 60).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>

</html>
